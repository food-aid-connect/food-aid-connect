
name: Python CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodaid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run SQLite tests
        working-directory: backend
        run: python -m pytest -q

      - name: Create disposable seed test database
        env:
          PGPASSWORD: postgres
        run: createdb --host=localhost --username=postgres foodaid_seed_test

      - name: Run PostgreSQL tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foodaid_test
          FAC_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foodaid_test
          FAC_SEED_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foodaid_seed_test
        run: python -m pytest -q
